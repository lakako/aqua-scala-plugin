# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
# Scala 3 (scala/scala3)
#
# Starting from 3.5.0, Scala 3 ships native binaries (bundled JVM, no external JDK needed).
# Older releases (including the 3.3.x LTS line) only have JVM-based archives.
#
# Asset naming:
#   Native (3.5+): scala3-{version}-{arch}-{platform}.tar.gz (Linux/macOS)
#                  scala3-{version}-{arch}-pc-win32.zip       (Windows)
#   JVM (all):     scala3-{version}.tar.gz / .zip            (platform-independent, JDK required)
#
# Archive layout:
#   Native (3.5+): scala3-{version}-{arch}-{platform}/bin/{scala, scalac, scaladoc}
#   JVM (< 3.5.0): scala3-{version}/bin/{scala, scalac, scaladoc}
packages:
  - type: github_release
    repo_owner: scala
    repo_name: scala3
    description: The Scala 3 programming language compiler and toolchain (native binary, bundled JVM)
    link: https://www.scala-lang.org/
    asset: scala3-{{.Version}}-{{.Arch}}-{{.OS}}.tar.gz
    format: tar.gz
    files:
      - name: scala
        src: scala3-{{.Version}}-{{.Arch}}-{{.OS}}/bin/scala
      - name: scalac
        src: scala3-{{.Version}}-{{.Arch}}-{{.OS}}/bin/scalac
      - name: scaladoc
        src: scala3-{{.Version}}-{{.Arch}}-{{.OS}}/bin/scaladoc
    replacements:
      amd64: x86_64
      arm64: aarch64
      linux: pc-linux
      darwin: apple-darwin
    overrides:
      - goos: windows
        asset: scala3-{{.Version}}-{{.Arch}}-pc-win32.zip
        format: zip
        files:
          - name: scala
            src: scala3-{{.Version}}-{{.Arch}}-pc-win32/bin/scala.bat
          - name: scalac
            src: scala3-{{.Version}}-{{.Arch}}-pc-win32/bin/scalac.bat
          - name: scaladoc
            src: scala3-{{.Version}}-{{.Arch}}-pc-win32/bin/scaladoc.bat
    supported_envs:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
      - windows/amd64
    version_constraint: semver(">= 3.5.0")
    version_overrides:
      # Scala 3.3.x LTS and older (before 3.5.0): only JVM-based archives
      # These require a separately installed JDK.
      - version_constraint: semver("< 3.5.0")
        asset: scala3-{{.Version}}.zip
        format: zip
        files:
          - name: scala
            src: scala3-{{.Version}}/bin/scala
          - name: scalac
            src: scala3-{{.Version}}/bin/scalac
          - name: scaladoc
            src: scala3-{{.Version}}/bin/scaladoc
        overrides:
          - goos: windows
            files:
              - name: scala
                src: scala3-{{.Version}}/bin/scala.bat
              - name: scalac
                src: scala3-{{.Version}}/bin/scalac.bat
              - name: scaladoc
                src: scala3-{{.Version}}/bin/scaladoc
        supported_envs:
          - all
