# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
# Scala 2 (scala/scala)
#
# Scala 2 is JVM-based and platform-independent: a single .zip works on all platforms.
# A separately installed JDK (8+) is required.
#
# GitHub Release tags use a "v" prefix (e.g. v2.13.16), but the asset filename does not:
#   scala-2.13.16.zip
#
# Archive layout:
#   scala-{version}/
#     bin/
#       scala      (or scala.bat on Windows)
#       scalac     (or scalac.bat on Windows)
#       ...
packages:
  - type: github_release
    repo_owner: scala
    repo_name: scala
    description: The Scala 2 programming language compiler and toolchain (JVM-based, requires JDK 8+)
    link: https://www.scala-lang.org/
    asset: scala-{{trimV .Version}}.zip
    format: zip
    files:
      - name: scala
        src: scala-{{trimV .Version}}/bin/scala
      - name: scalac
        src: scala-{{trimV .Version}}/bin/scalac
    overrides:
      - goos: windows
        files:
          - name: scala
            src: scala-{{trimV .Version}}/bin/scala.bat
          - name: scalac
            src: scala-{{trimV .Version}}/bin/scalac.bat
    supported_envs:
      - all
